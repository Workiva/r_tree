name: r_tree
version: 3.0.2
description: R-tree implementation to index and query two-dimensional data
homepage: https://github.com/Workiva/r_tree

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  benchmark_harness: any
  build_runner: ^2.3.3
  build_test: '>=2.1.6 <4.0.0'
  build_web_compilers: '>=3.2.7 <5.0.0'
  dependency_validator: '>=3.0.0 <6.0.0'
  test: '>=1.15.7 <1.32.0'
  workiva_analysis_options: ^1.4.0
